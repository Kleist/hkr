[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hkr"
version = "0.1.0"
description = "Scraper for Hvidovre Kommune's dagsordener og referater (FirstAgenda Publication)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pypdf>=4.2",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
]

[project.scripts]
hkr = "hkr.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hkr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
